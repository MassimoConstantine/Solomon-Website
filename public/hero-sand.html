<!doctype html>
<!--
  HERO — SAND ON THE CRITICAL LINE (2026-09-09). RH as the line of truth, in the grains design.
  White grainy paper, tens of thousands of very fine dark grains. The page is the critical strip
  (real part across, height up). The whole sheet VIBRATES with the real Riemann zeta function:
  amplitude = |zeta(sigma + i t)|, computed on load from the function itself (Borwein's algorithm,
  verified: |zeta| ~ 1e-7 at the known zeros). The sand rolls down log|zeta| — harmonic away from the zeros, so it has NO resting place except the zeros — and is thrown about where the
  plate moves and comes to rest where it is silent — the nodes. Zeta's nodes are its zeros. There is
  NO rule in this file that says "go to the line": the sand finds the line because the line is the
  only place the sheet is silent. Where it rests are the true zero heights 14.13, 21.02, 25.01 ...
  (t from 8 to 108, twenty-nine zeros). The lamp (wandering, or the visitor's cursor) SHAKES the
  sheet where it touches — a disturbance — and the sand finds the line again. MIRROR PAIRS: a zero off the line would have a twin mirrored across it (functional equation) — so every grain in
  the strip that is off the line is drawn with its paler twin across the line; on the line the pair is one dark grain. No text.
  Caption for the page copy, never on the picture: these are the zeros we know; the hypothesis is
  that it never stops. Solomon verifies, it does not generate.
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solomon</title><style>html,body{margin:0;height:100%;background:#fff;overflow:hidden;cursor:crosshair}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas><script>
(()=>{
const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
// ---- the real function: |zeta(sigma+it)| by Borwein's method on eta ----
function borweinD(n){const d=new Array(n+1);let s=0;for(let k=0;k<=n;k++){let term=1;for(let i=1;i<=k;i++)term*=(n+i-1)*(n-i+1)/((2*i-1)*(2*i))*4;s+=term;d[k]=n*s}return d}
const NB=140,D=borweinD(NB),LOGS=[],POW=[];for(let k=0;k<NB;k++){LOGS[k]=Math.log(k+1)}
function absZeta(sig,t){let re=0,im=0;for(let k=0;k<NB;k++){const c=(k%2?-1:1)*(D[k]-D[NB]);const m=Math.exp(-sig*LOGS[k]),ph=-t*LOGS[k];re+=c*m*Math.cos(ph);im+=c*m*Math.sin(ph)}
  re/=-D[NB];im/=-D[NB];const p=Math.pow(2,1-sig),a=1-p*Math.cos(-t*Math.LN2),b=-p*Math.sin(-t*Math.LN2);const den=a*a+b*b;return Math.hypot((re*a+im*b)/den,(im*a-re*b)/den)}
// ---- the sheet: sigma from -0.35 to 1.35 across the page, t from 8 to 108 up the page ----
const T0=8,T1=108,BAND=0.13;
let W,H,S,img,buf,paper,N,px,py,vx,vy,AG,AGW,AW,AH,G=96,gx,gy,cell,cnt,sm,mx=-1e4,my=-1e4,mt=-1e9,seed=rng(9);
function samp(G,X,Y){const u=((X/W-0.5)/BAND+0.5)*(AW-1),v=((H-1-Y)/H)*(AH-1);const i0=Math.max(0,Math.min(AW-2,u|0)),j0=Math.max(0,Math.min(AH-2,v|0)),tx=u-i0,ty=v-j0;
  return (G[j0*AW+i0]*(1-tx)+G[j0*AW+i0+1]*tx)*(1-ty)+(G[(j0+1)*AW+i0]*(1-tx)+G[(j0+1)*AW+i0+1]*tx)*ty}
const amp=(X,Y)=>samp(AG,X,Y),ampw=(X,Y)=>samp(AGW,X,Y);
function size(){S=Math.min(devicePixelRatio||1,2);W=Math.round(innerWidth*S);H=Math.round(innerHeight*S);c.width=W;c.height=H;img=x.createImageData(W,H);buf=img.data;
  // amplitude grid: the vibration of the sheet, from the function itself
  AW=241;AH=Math.max(400,Math.min(1000,H));AG=new Float32Array(AW*AH);AGW=new Float32Array(AW*AH);
  for(let j=0;j<AH;j++){const t=T0+(T1-T0)*j/(AH-1);for(let i=0;i<AW;i++){const sg=i/(AW-1);const z=absZeta(Math.max(0.01,sg),t);
    // sigma<=0 is loud (functional equation) — treat it as loud edge rather than evaluate there
    AG[j*AW+i]=sg<=0.01?1:1-Math.exp(-z/0.11);AGW[j*AW+i]=sg<=0.01?2:Math.log(z+1e-6)}}
  N=Math.min(60000,Math.round(W*H/55));px=new Float32Array(N);py=new Float32Array(N);vx=new Float32Array(N);vy=new Float32Array(N);
  const r=rng(20260909);const K=[];for(let k=0;k<34;k++){const side=r()<0.5?-1:1;const xx=W*0.5+side*W*(0.12+0.36*r());K.push([xx,r()*H,Math.min(W,H)*(0.02+0.05*r())])}
  for(let i=0;i<N;i++){if(r()<0.4){const k=K[(r()*K.length)|0];const a=r()*6.283,d=Math.sqrt(r())*k[2];px[i]=Math.min(W-1,Math.max(0,k[0]+Math.cos(a)*d));py[i]=Math.min(H-1,Math.max(0,k[1]+Math.sin(a)*d*0.7))}else if(r()<0.4){px[i]=W*0.5+(r()-0.5)*W*BAND*0.6;py[i]=r()*H}else{px[i]=r()*W;py[i]=r()*H}vx[i]=0;vy[i]=0}
  cell=Math.ceil(Math.max(W,H)/G);gx=Math.ceil(W/cell);gy=Math.ceil(H/cell);cnt=new Float32Array(gx*gy);sm=new Float32Array(gx*gy);
  paper=new Uint8ClampedArray(W*H*4);const pr=rng(41);for(let o=0;o<W*H*4;o+=4){const v=255-((pr()*9)|0)-((pr()<0.012)?18:0);paper[o]=v;paper[o+1]=v;paper[o+2]=v;paper[o+3]=255}}
addEventListener('resize',size);size();
addEventListener('pointermove',e=>{mx=e.clientX*S;my=e.clientY*S;mt=performance.now()});
addEventListener('pointerdown',e=>{mx=e.clientX*S;my=e.clientY*S;mt=performance.now()});
// the lamp shakes the sheet where it touches: wandering by itself, or the visitor's cursor
function shake(X,Y,now){const age=(now-mt)/1000;let lx=mx,ly=my,str=Math.max(0,1-age/5);if(age>=5){lx=W*(0.5+0.42*Math.sin(now*0.00009));ly=H*(0.5+0.4*Math.sin(now*0.00014+1.3));str=0.7}
  const d=Math.hypot(X-lx,Y-ly),rr=Math.min(W,H)*0.16;if(d>=rr)return 0;const k=1-d/rr;return k*k*str}
let t0=performance.now();let paintOn=true;
function frame(now){const dt=paintOn?Math.min(2,(now-t0)/16.7):1;t0=now;const pulse=0.5+0.5*Math.sin(now*2*Math.PI/6000);
  cnt.fill(0);for(let i=0;i<N;i++){const cx=(px[i]/cell)|0,cy=(py[i]/cell)|0;cnt[cy*gx+cx]++}
  for(let j=0;j<gy;j++)for(let i=0;i<gx;i++){let a=0,n=0;for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){const ii=i+di,jj=j+dj;if(ii>=0&&jj>=0&&ii<gx&&jj<gy){a+=cnt[jj*gx+ii];n++}}sm[j*gx+i]=a/n}
  const mean=N/(gx*gy),L0=W*(0.5-BAND/2),L1=W*(0.5+BAND/2);
  for(let i=0;i<N;i++){const X=px[i],Y=py[i];const inStrip=X>L0&&X<L1;const lampK=shake(X,Y,now);
    if(inStrip){const A=Math.min(1,amp(X,Y)+lampK);if(Math.abs(X-W/2)>BAND*W/2*0.8)vx[i]+=(X<W/2?1:-1)*0.08*dt;
      const e=4;const gxv=(ampw(Math.min(L1-1,X+e),Y)-ampw(Math.max(L0+1,X-e),Y))/(2*e),gyv=(ampw(X,Math.min(H-1,Y+e))-ampw(X,Math.max(0,Y-e)))/(2*e);
      const gm=Math.hypot(gxv,gyv)||1e-9,cap=Math.min(1.1,gm*40)/gm;vx[i]+=(-gxv*cap+(seed()-0.5)*1.2*A*(0.7+0.6*pulse))*dt;vy[i]+=(-gyv*cap+(seed()-0.5)*1.2*A*(0.7+0.6*pulse)-0.05*A)*dt}
    else{ // shadow: sand pools into ink; a pool the lamp reaches is released and drains toward the strip
      const fx=X/cell-0.5,fy=Y/cell-0.5,i0=Math.max(0,Math.min(gx-2,fx|0)),j0=Math.max(0,Math.min(gy-2,fy|0)),tx=Math.min(1,Math.max(0,fx-i0)),ty=Math.min(1,Math.max(0,fy-j0));
      const s00=sm[j0*gx+i0],s10=sm[j0*gx+i0+1],s01=sm[(j0+1)*gx+i0],s11=sm[(j0+1)*gx+i0+1];const dens=((s00*(1-tx)+s10*tx)*(1-ty)+(s01*(1-tx)+s11*tx)*ty)/mean;
      let gxv=((s10-s00)*(1-ty)+(s11-s01)*ty),gyv=((s01-s00)*(1-tx)+(s11-s10)*tx);const gm=Math.hypot(gxv,gyv)||1;
      const inward=X<W/2?1:-1;const dline=Math.max(60,Math.abs(X-W/2));const grav=inward*(0.35+0.65*pulse)*3.2/dline;vx[i]+=grav*(dens<1.1?1:0.33)*dt;
      if(lampK>0.12){vx[i]+=inward*0.35*lampK*dt;vx[i]+=(seed()-0.5)*0.05*dt;vy[i]+=(seed()-0.5)*0.05*dt}
      else{const edge=Math.min(X,W-1-X)<W*0.07;const pool=edge?0:0.072*Math.max(0,1-dens/3.2);const drift=edge?inward*0.05:(dens<1.1?inward*0.006:0);vx[i]+=(gxv/gm*pool+drift+(seed()-0.5)*0.05)*dt;vy[i]+=(gyv/gm*pool+(seed()-0.5)*0.05)*dt}}
    vx[i]*=0.86;vy[i]*=0.86;
    let nx=X+vx[i]*dt,ny=Y+vy[i]*dt;if(!inStrip&&seed()<0.00006)ny=-1; /* a tiny trickle is reborn at the edges */
    if(nx<0||nx>=W)ny=-1;if(ny<0){const side=seed()<0.5;nx=side?seed()*1.5:W-1-seed()*1.5;ny=seed()*H;vx[i]=side?0.6:-0.6;vy[i]=0}if(ny>=H)ny=H-1;px[i]=nx;py[i]=ny}
  if(!paintOn)return;
  buf.set(paper);
  for(let i=0;i<N;i++){const X=px[i]|0,Y=py[i]|0;const inS=X>L0&&X<L1;const A=inS?amp(X,Y):1;const dens=inS?0:Math.min(1,sm[((Y/cell)|0)*gx+((X/cell)|0)]/((N/(gx*gy))*2.2));const ink=inS?(A<0.25?Math.round(6+70*(1-pulse)):Math.round(10+205*Math.min(1,A*1.25))):Math.round(30+60*(1-dens));
    if(inS){const off=Math.abs(px[i]-W*0.5);if(off>2.5){const MX=Math.round(W-px[i]);if(MX>=0&&MX<W){const om=(Y*W+MX)*4,mk=Math.min(250,ink+70);buf[om]=Math.min(buf[om],mk);buf[om+1]=Math.min(buf[om+1],mk);buf[om+2]=Math.min(buf[om+2],mk+2)}}}const o=(Y*W+X)*4;buf[o]=Math.min(buf[o],ink);buf[o+1]=Math.min(buf[o+1],ink);buf[o+2]=Math.min(buf[o+2],ink+2);
    if(A<0.25&&X+1<W){const o2=o+4,k=Math.round(ink+30+40*(1-pulse));buf[o2]=Math.min(buf[o2],k);buf[o2+1]=Math.min(buf[o2+1],k);buf[o2+2]=Math.min(buf[o2+2],k+2);if(pulse>0.6&&X>0){const o3=o-4,k3=Math.round(ink+60+120*(1-pulse));buf[o3]=Math.min(buf[o3],k3);buf[o3+1]=Math.min(buf[o3+1],k3);buf[o3+2]=Math.min(buf[o3+2],k3+2)}}}
  x.putImageData(img,0,0);
  if(!reduce)requestAnimationFrame(frame)}
const q=(typeof location!=='undefined'&&location.search.match(/steps=(\d+)/));if(q){paintOn=false;for(let k=0;k<+q[1];k++)frame(t0+k*16.7);paintOn=true;frame(t0+(+q[1])*16.7)}
requestAnimationFrame(frame);
})();
</script></body></html>
